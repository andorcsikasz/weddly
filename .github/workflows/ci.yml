name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.10

permissions:
  contents: read

jobs:
  lint:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun audit --production

  container-security:
    name: Images & security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production images
        run: |
          docker build --tag weddly-web:ci .
      - name: Scan repository secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: weddly-web:ci
          scanners: vuln
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  migration-safety:
    name: SQLite migration safety
    runs-on: ubuntu-latest
    steps:
      # Full history is required: the check boots current db.ts over the exact
      # schema that production/main had before this push or pull request.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve production base revision
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUSH_BEFORE_SHA" ] \
            && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "sha=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=HEAD^" >> "$GITHUB_OUTPUT"
          fi
      - name: Boot current migrations twice over previous schema
        run: bun run check:migrations --base "${{ steps.base.outputs.sha }}"

  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - run: bun install --frozen-lockfile
      - name: Backend tests (incl. e2e)
        run: cd backend && bun run test
      - name: Frontend release smoke
        run: |
          cd frontend
          bun test \
            tests/lib/api.test.ts \
            tests/lib/budget.test.ts \
            tests/lib/i18n_missing_key.test.tsx \
            tests/components/smoke.test.tsx \
            tests/components/ui/Button.test.tsx \
            tests/components/ui/TagChip.test.tsx \
            tests/components/ui/ToastProvider.test.tsx \
            tests/components/ui/SegmentedControl.test.tsx \
            tests/components/ui/EntryDialogProvider.test.tsx \
            tests/components/ui/TextField.test.tsx \
            tests/components/ui/ConfirmDialogProvider.test.tsx
      - name: Frontend full suite
        run: cd frontend && bun run test
      - name: Frontend build
        run: bun run build
      - name: Frontend bundle budget
        run: bun run check:bundle
