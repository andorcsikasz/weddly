<?xml version="1.0" encoding="UTF-8"?>
<!--
  Organization-schema logo. 512×512 square, used by the JSON-LD
  Organization.logo emitted by backend/src/lib/seo_ssr.ts so Google can
  show a brand mark in knowledge-panel / rich-result placements. Visual
  treatment matches og.svg (cream wordmark on king blue) but cropped to
  a square the way Google expects logos. Re-render the PNG with
  `bun run og` after editing.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
>
  <rect width="512" height="512" fill="#1d3a8a" />
  <rect
    x="28"
    y="28"
    width="456"
    height="456"
    fill="none"
    stroke="#f6f2e7"
    stroke-width="1"
    stroke-opacity="0.22"
  />
  <text
    x="256"
    y="270"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="84"
    font-weight="600"
    letter-spacing="14"
    fill="#f6f2e7"
    text-anchor="middle"
  >WĒDDLY</text>
  <line x1="186" y1="320" x2="246" y2="320" stroke="#f6f2e7" stroke-width="1" stroke-opacity="0.45" />
  <line x1="266" y1="320" x2="326" y2="320" stroke="#f6f2e7" stroke-width="1" stroke-opacity="0.45" />
  <text
    x="256"
    y="346"
    font-family="'Inter', system-ui, sans-serif"
    font-size="14"
    font-weight="500"
    letter-spacing="6"
    fill="#f6f2e7"
    fill-opacity="0.7"
    text-anchor="middle"
  >WEDDING · PLANNING</text>
</svg>
