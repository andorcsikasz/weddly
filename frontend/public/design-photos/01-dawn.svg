<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Warm dawn wash">
  <defs>
    <linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5EFE6"/>
      <stop offset="0.5" stop-color="#EBD9C7"/>
      <stop offset="1" stop-color="#D8A986"/>
    </linearGradient>
    <radialGradient id="dawnSun" cx="0.5" cy="0.86" r="0.55">
      <stop offset="0" stop-color="#F4D9AE" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#E9BE95" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E9BE95" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#dawnSky)"/>
  <rect width="1200" height="800" fill="url(#dawnSun)"/>
</svg>
