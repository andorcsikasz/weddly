<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Soft ochre dot grid">
  <defs>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="9" fill="#C99A5B"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E9D8" stop-opacity="0"/>
      <stop offset="1" stop-color="#F3E9D8" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#F3E9D8"/>
  <rect width="1200" height="800" fill="url(#dots)" opacity="0.55"/>
  <rect width="1200" height="800" fill="url(#fade)"/>
</svg>
