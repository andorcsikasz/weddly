<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph / Twitter share card. 1200×630, the canonical OG size.
  Minimalist treatment — solid king-blue field, wide-tracked WĒDDLY
  wordmark, single tagline. Self-contained: no font files or external
  assets. Falls back to Georgia if Cormorant Garamond is missing.

  Not every social scraper renders SVG og:image reliably (Twitter,
  Facebook expect PNG/JPG). The matching PNG is generated with
  `bun run og` from the frontend workspace — keep both in sync.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
>
  <!-- Background: king blue, one solid field. -->
  <rect width="1200" height="630" fill="#1d3a8a" />

  <!-- Hairline frame inset from the edges to give the card an
       engraved, stationery-card feel without breaking minimalism. -->
  <rect
    x="40"
    y="40"
    width="1120"
    height="550"
    fill="none"
    stroke="#f6f2e7"
    stroke-width="1"
    stroke-opacity="0.22"
  />

  <!-- Wordmark — wide-tracked serif caps with macron Ē, centred. -->
  <text
    x="600"
    y="320"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="120"
    font-weight="600"
    letter-spacing="36"
    fill="#f6f2e7"
    text-anchor="middle"
  >WĒDDLY</text>

  <!-- Hairline ornament rules flanking the tagline -->
  <line x1="380" y1="395" x2="500" y2="395" stroke="#f6f2e7" stroke-width="1" stroke-opacity="0.4" />
  <line x1="700" y1="395" x2="820" y2="395" stroke="#f6f2e7" stroke-width="1" stroke-opacity="0.4" />

  <!-- One-liner tagline — italic serif, restrained, paper-cream. -->
  <text
    x="600"
    y="408"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="34"
    font-style="italic"
    fill="#f6f2e7"
    fill-opacity="0.92"
    text-anchor="middle"
  >Plan your wedding, calmly. Together.</text>

  <!-- URL footer — small caps, wide-tracked, bottom centre. -->
  <text
    x="600"
    y="555"
    font-family="'Inter', system-ui, sans-serif"
    font-size="14"
    font-weight="500"
    letter-spacing="6"
    fill="#f6f2e7"
    fill-opacity="0.7"
    text-anchor="middle"
  >WEDDLY.XYZ</text>
</svg>
