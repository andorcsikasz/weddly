<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Weddly">
  <!-- Dark-blue square + white dove silhouette. Replaces the two-rings
       favicon — peace-dove iconography is more brand-distinctive than
       interlocking bands (which read as Olympic rings at 16x16) and the
       white-on-navy contrast survives Google's circular SERP crop.

       Background uses the brand's logo navy (#1d3a8a) so the favicon
       and Organization-schema logo share a colour story.

       The dove is composed of primitives rather than one freehand path
       so each feature (body, head, beak, tail, wing) lands at a
       predictable size — at 16x16 the head + beak are the only details
       guaranteed to survive antialiasing, so they sit on the upper
       right where the eye lands first. -->
  <rect width="64" height="64" fill="#1d3a8a"/>
  <g fill="#ffffff">
    <!-- Body — tilted ellipse, head-end raised. -->
    <ellipse cx="28" cy="36" rx="15" ry="7.5" transform="rotate(-10 28 36)"/>
    <!-- Tail flare at the back (left), simple forked notch. -->
    <path d="M 10 34 L 17 38 L 10 42 L 15 38 Z"/>
    <!-- Head. -->
    <circle cx="44" cy="27" r="6.5"/>
    <!-- Beak — small wedge pointing right. -->
    <path d="M 49 25 L 56 25.5 L 50 30 Z"/>
    <!-- Raised wing arcing above the body. -->
    <path d="M 22 32 Q 28 16 40 21 Q 38 31 30 33 Q 25 33 22 32 Z"/>
  </g>
</svg>
