<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Weddly">
  <!-- Wedding-band-inspired badge. Navy disc + cream serif-flavoured W as
       a zig-zag path (so glyph stays sharp at 16×16 without depending on
       Georgia being installed). Inset coral ring is thick enough to
       survive a 16×16 render — earlier 1.25px ring vanished entirely. -->
  <circle cx="32" cy="32" r="31" fill="#101830"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#e2826a" stroke-width="2.5" stroke-opacity="0.85"/>
  <path d="M 14 20 L 24 46 L 32 27 L 40 46 L 50 20"
        fill="none" stroke="#efe9d9" stroke-width="7.5"
        stroke-linejoin="miter" stroke-linecap="round" stroke-miterlimit="2"/>
</svg>
