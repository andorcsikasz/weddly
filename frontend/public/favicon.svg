<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Weddly">
  <!-- Two interlocking wedding bands on a full-bleed paper-cream square.
       Replaces the older serif-W zig-zag badge, which read as a fuzzy
       chevron in Google's 16x16 SERP favicon slot. Universal wedding
       symbol, no glyph dependencies, survives both raw (browser tab) and
       circle-cropped (Google SERP, iOS home-screen) renderings.

       Palette: paper-50 (#efe9d9) surface + ink-900 (#101830) rings —
       the brand's quiet "wedding stationery" pair rather than a generic
       blue badge.

       Stroke width 5 on a 64 viewBox = ~1.25px at 16x16; thinner than
       that sub-pixel-averages into a fuzzy haze. Each ring sits ~9 units
       off centre so the overlap reads as a linked pair rather than a
       single thick band, and so neither ring crowds the safe-area inset
       Google's circular crop reserves. -->
  <rect width="64" height="64" fill="#efe9d9"/>
  <g fill="none" stroke="#101830" stroke-width="5">
    <circle cx="23" cy="32" r="14"/>
    <circle cx="41" cy="32" r="14"/>
  </g>
</svg>
