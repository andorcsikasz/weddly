<!doctype html>
<html lang="hu" class="bg-paper-100 text-ink-800">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9d9" />
    <!--
      The SEO head block below is rewritten per request by backend/src/lib/seo_ssr.ts
      so weddly.hu (HU canonical) and weddly.xyz (EN canonical) each get their
      own locale-appropriate meta tags + hreflang alternates. The static
      content here is the HU fallback used by Vite dev and any direct file
      access that bypasses the Bun server. Do NOT remove the sentinel
      comments — the rewriter splices between them.
    -->
    <!-- SEO_HEAD_START -->
    <title>Wēddly — az egész esküvőtök egy helyen</title>
    <meta
      name="description"
      content="Költségvetés, vendéglista, RSVP, ültetés és nyomtatványok egy közös felületen. Pár perc beállítás, és estékből percek lesznek."
    />
    <link rel="canonical" href="https://weddly.hu/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wēddly" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://weddly.hu/" />
    <meta property="og:title" content="Wēddly — az egész esküvőtök egy helyen" />
    <meta
      property="og:description"
      content="Költségvetés, vendéglista, RSVP, ültetés, nyomtatható kártyák — egy közös felületen. A nyílt béta alatt ingyenes."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wēddly — közösen tervezzétek az esküvőtöket, nyugodtan." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wēddly — az egész esküvőtök egy helyen" />
    <meta
      name="twitter:description"
      content="Egy közös felület mindkettőtöknek. A nyílt béta alatt ingyenes."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="alternate" hreflang="hu" href="https://weddly.hu/" />
    <link rel="alternate" hreflang="en" href="https://weddly.xyz/" />
    <link rel="alternate" hreflang="x-default" href="https://weddly.hu/" />
    <!-- SEO_HEAD_END -->
    <!--
      Fonts are intentionally NOT loaded from third-party hosts (rsms.me,
      Google Fonts) so that the landing page can render without leaking
      visitor IPs to font CDNs. The Tailwind sans + serif stacks fall
      back to the host OS fonts (Inter / Cormorant if installed locally,
      otherwise the platform UI sans / Georgia for the display serif).
      If we ever want pixel-identical typography across platforms, ship
      WOFF2 files from /public/fonts and re-introduce @font-face rules
      in src/index.css — but keep them self-hosted.
    -->
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
