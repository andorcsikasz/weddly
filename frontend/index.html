<!doctype html>
<html lang="hu" data-default-locale="hu" class="bg-paper-100 text-ink-800">
  <head>
    <meta charset="UTF-8" />
    <!-- Cookie consent is first-party now (see src/lib/consent.ts +
         src/components/CookieConsentBanner.tsx) — the Cookiebot account this
         used to depend on had its domain never authorized and its trial
         expired, permanently blocking the banner. Every optional analytics
         loader in this document and in seo_ssr.ts stays marked
         data-cookieconsent="statistics" as inert `type="text/plain"`; the
         banner flips them to real scripts on consent, same convention. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9d9" />
    <!-- iOS PWA hints: lets Safari's "Add to Home Screen" present the app
         in a chrome-less window once the guest installs from an /rsvp
         page. The manifest covers Android/Chromium. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wēddly" />
    <!--
      The SEO head block below is rewritten per request by backend/src/lib/seo_ssr.ts.
      Single-host deployment on tryweddly.com — the rewriter emits the
      Hungarian canonical and skips incomplete language alternates.
      The static content here is the HU fallback used by Vite dev and any
      direct file access that bypasses the Bun server. Do NOT remove the
      sentinel comments — the rewriter splices between them.
    -->
    <!-- SEO_HEAD_START -->
    <title>Esküvőtervezés, stressz nélkül | Weddly</title>
    <meta
      name="description"
      content="Tervezzétek együtt az esküvőt: közös költségvetés, vendéglista, személyes RSVP-linkek és vizuális ültetési rend egy helyen, pároknak."
    />
    <meta name="robots" content="index,follow" />
    <meta name="application-name" content="Wēddly" />
    <link rel="canonical" href="https://tryweddly.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wēddly" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://tryweddly.com/" />
    <meta property="og:title" content="Esküvőszervező alkalmazás pároknak | Weddly" />
    <meta
      property="og:description"
      content="Tervezzétek együtt az esküvőt: közös költségvetés, vendéglista, személyes RSVP-linkek és vizuális ültetési rend egy helyen, pároknak."
    />
    <meta property="og:image" content="https://tryweddly.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="Wēddly · Nyugodt esküvőszervezés, egyetlen közös, naprakész tervvel kettőtöknek." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Esküvőszervező alkalmazás pároknak | Weddly" />
    <meta
      name="twitter:description"
      content="Tervezzétek együtt az esküvőt: közös költségvetés, vendéglista, személyes RSVP-linkek és vizuális ültetési rend egy helyen, pároknak."
    />
    <meta name="twitter:image" content="https://tryweddly.com/og.png" />
    <link rel="alternate" hreflang="hu-HU" href="https://tryweddly.com/" />
    <link rel="alternate" hreflang="x-default" href="https://tryweddly.com/" />
    <!-- SEO_HEAD_END -->
    <!--
      Hide the prerendered SEO body from human users. The prerender script
      (frontend/scripts/prerender.ts) bakes a semantic HTML body inside
      <div id="root"> so crawlers parsing the HTML directly see real
      content. Real users used to catch a brief flash of that unstyled
      block before React's createRoot() wiped it; on slow connections or
      when the JS bundle is delayed the flash could last seconds and felt
      like a "raw sitemap" page. Hiding it inline (before any external
      stylesheet loads) means humans never see it, while Googlebot's
      rendered crawl (which is what actually drives SPA ranking now) still
      indexes the React app once it hydrates. Inline <style> is allowed by
      CSP via 'unsafe-inline' in style-src.
    -->
    <style>
      .seo-prerender { display: none !important; }
    </style>
    <!--
      Fonts are intentionally NOT loaded from third-party hosts (rsms.me,
      Google Fonts) so that the landing page can render without leaking
      visitor IPs to font CDNs. The Tailwind sans + serif stacks fall
      back to the host OS fonts (Inter / Cormorant if installed locally,
      otherwise the platform UI sans / Georgia for the display serif).
      If we ever want pixel-identical typography across platforms, ship
      WOFF2 files from /public/fonts and re-introduce @font-face rules
      in src/index.css -- but keep them self-hosted.
    -->
    <!-- Microsoft Clarity is optional analytics. Keep the bootstrap inert
         until the consent banner (src/components/CookieConsentBanner.tsx)
         records statistics consent; loading it before that would contradict
         both the banner choice and the privacy notice. -->
    <script type="text/plain" data-cookieconsent="statistics">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xd80y5mfbo");
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
