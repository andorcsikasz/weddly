<!doctype html>
<html lang="hu" class="bg-paper-100 text-ink-800">
  <head>
    <meta charset="UTF-8" />
    <!-- Cookiebot consent manager — must be the first script in <head> so it
         can block other scripts before they fire. CBID is Weddly's account id. -->
    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="dbc1cd47-eac4-464f-a0ac-bf68a48bab1e" data-blockingmode="auto" type="text/javascript"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9d9" />
    <!-- iOS PWA hints: lets Safari's "Add to Home Screen" present the app
         in a chrome-less window once the guest installs from an /rsvp
         page. The manifest covers Android/Chromium. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Weddly" />
    <!--
      The SEO head block below is rewritten per request by backend/src/lib/seo_ssr.ts.
      Single-host deployment (weddly.hu) as of May 2026 — the rewriter
      always emits weddly.hu as the canonical and skips the EN hreflang.
      The static content here is the HU fallback used by Vite dev and any
      direct file access that bypasses the Bun server. Do NOT remove the
      sentinel comments — the rewriter splices between them.
    -->
    <!-- SEO_HEAD_START -->
    <title>Wēddly · Közös esküvőtervezés egy helyen</title>
    <meta
      name="description"
      content="Tervezzétek együtt az esküvőtöket egy nyugodt, közös felületen: költségvetés, vendégek, RSVP, ültetés, nyomtatható kártyák. Mindkettőtök ugyanazt látja, valós időben."
    />
    <meta name="application-name" content="Wēddly" />
    <link rel="canonical" href="https://weddly.hu/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wēddly" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://weddly.hu/" />
    <meta property="og:title" content="Wēddly · Közös esküvőtervezés egy helyen" />
    <meta
      property="og:description"
      content="Tervezzétek együtt az esküvőtöket egy nyugodt, közös felületen: költségvetés, vendégek, RSVP, ültetés, nyomtatható kártyák. Mindkettőtök ugyanazt látja, valós időben."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wēddly — The low-cortisol wedding planner platform." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wēddly · Közös esküvőtervezés egy helyen" />
    <meta
      name="twitter:description"
      content="Közös felület mindkettőtöknek, egy helyen."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="alternate" hreflang="hu" href="https://weddly.hu/" />
    <link rel="alternate" hreflang="x-default" href="https://weddly.hu/" />
    <!-- SEO_HEAD_END -->
    <!--
      Hide the prerendered SEO body from human users. The prerender script
      (frontend/scripts/prerender.ts) bakes a semantic HTML body inside
      <div id="root"> so crawlers parsing the HTML directly see real
      content. Real users used to catch a brief flash of that unstyled
      block before React's createRoot() wiped it; on slow connections or
      when the JS bundle is delayed the flash could last seconds and felt
      like a "raw sitemap" page. Hiding it inline (before any external
      stylesheet loads) means humans never see it, while Googlebot's
      rendered crawl (which is what actually drives SPA ranking now) still
      indexes the React app once it hydrates. Inline <style> is allowed by
      CSP via 'unsafe-inline' in style-src.
    -->
    <style>
      .seo-prerender { display: none !important; }

      /* ── Cookiebot consent banner — Weddly brand skin ────────────────────
         Targets the Cookiebot-injected DOM. All overrides need !important
         because Cookiebot's own stylesheet is also !important-heavy.
         Color tokens mirror tailwind.config.js exactly so a token change
         only needs updating here.
         paper-100:#f6f2e7  paper-200:#efe9d9  paper-300:#e3d9bf
         blush-500:#d35d42  blush-600:#bf4a30
         umber-500:#8a6841  umber-700:#3a2e22  umber-900:#1a1410
      ──────────────────────────────────────────────────────────────────── */

      /* Overlay backdrop — very subtle so the page feels alive behind */
      #CybotCookiebotDialogUnderlay {
        background: rgba(26, 20, 16, 0.35) !important;
        backdrop-filter: blur(2px) !important;
      }

      /* Main dialog card. `html body` prefix raises specificity above
         Cookiebot's banner-template width rules — without it the bottom-bar
         template stretches the dialog full-width and ignores max-width. */
      html body #CybotCookiebotDialog {
        font-family: "General Sans", ui-sans-serif, system-ui, sans-serif !important;
        background: #f6f2e7 !important;
        border: 1px solid #e3d9bf !important;
        border-radius: 1rem !important;
        box-shadow: 0 16px 48px rgba(26, 20, 16, 0.18), 0 4px 16px rgba(26, 20, 16, 0.08) !important;
        color: #1a1410 !important;
        max-width: 360px !important;
        width: calc(100vw - 3rem) !important;
        max-height: calc(100dvh - 3rem) !important;
        overflow-y: auto !important;
        padding: 0 !important;
        inset: auto auto 1.5rem 1.5rem !important;
        transform: none !important;
      }

      /* Inner body wrapper — single column, tighter padding */
      html body #CybotCookiebotDialogBody {
        display: block !important;
        max-width: none !important;
        padding: 1.25rem 1.25rem 0 !important;
      }

      /* Hide the inline granular toggle row (Necessary / Preferences /
         Statistics / Marketing) on the first screen so the card stays small;
         it's still reachable behind the "Show details" link. */
      html body #CybotCookiebotDialogBodyLevelButtonsSelectPane,
      html body #CybotCookiebotDialogDetailBodyContentCookieContainerTypes {
        display: none !important;
      }

      /* Header / logo row — hide Cookiebot's default logo area */
      #CybotCookiebotDialogHeader {
        display: none !important;
      }

      /* Title */
      html body #CybotCookiebotDialogBodyContentTitle {
        font-family: "General Sans", ui-sans-serif, system-ui, sans-serif !important;
        font-size: 0.9375rem !important;
        font-weight: 700 !important;
        letter-spacing: -0.01em !important;
        color: #1a1410 !important;
        margin-bottom: 0.375rem !important;
        margin-top: 0 !important;
        padding: 0 !important;
      }

      /* Body text */
      html body #CybotCookiebotDialogBodyContentText,
      html body #CybotCookiebotDialogBodyContentText * {
        font-family: "General Sans", ui-sans-serif, system-ui, sans-serif !important;
        font-size: 0.75rem !important;
        line-height: 1.5 !important;
        color: #8a6841 !important;
      }
      #CybotCookiebotDialogBodyContentText a {
        color: #8a6841 !important;
        text-decoration: underline !important;
        text-underline-offset: 2px !important;
      }

      /* Tab nav (Consent / Details / About) */
      #CybotCookiebotDialogNav {
        border-bottom: 1px solid #e3d9bf !important;
        margin: 1rem 0 0 !important;
        padding: 0 !important;
        gap: 0 !important;
      }
      .CybotCookiebotDialogNavItemLink {
        font-family: "General Sans", ui-sans-serif, system-ui, sans-serif !important;
        font-size: 0.75rem !important;
        font-weight: 600 !important;
        letter-spacing: 0.05em !important;
        text-transform: uppercase !important;
        color: #8a6841 !important;
        padding: 0.6rem 0.875rem !important;
        border-bottom: 2px solid transparent !important;
        margin-bottom: -1px !important;
        transition: color 0.15s, border-color 0.15s !important;
      }
      .CybotCookiebotDialogNavItemLink:hover {
        color: #1a1410 !important;
      }
      .CybotCookiebotDialogNavItemLink.CybotCookiebotDialogNavItemLinkActive {
        color: #1a1410 !important;
        border-bottom-color: #d35d42 !important;
      }

      /* Details / checkboxes area */
      #CybotCookiebotDialogBodyLevelButtonsTable {
        background: transparent !important;
        border: none !important;
      }
      .CybotCookiebotDialogBodyLevelButtonDescription {
        font-size: 0.75rem !important;
        color: #8a6841 !important;
      }
      /* Toggle switches */
      .CybotCookiebotDialogBodyLevelButtonSlider {
        background: #e3d9bf !important;
        border-radius: 9999px !important;
      }
      input:checked + .CybotCookiebotDialogBodyLevelButtonSlider {
        background: #d35d42 !important;
      }

      /* Buttons wrapper — force a static, single-column stack (the banner
         template floats these to the right at full width otherwise). */
      html body #CybotCookiebotDialogBodyButtonsWrapper {
        position: static !important;
        float: none !important;
        width: auto !important;
        max-width: none !important;
        padding: 1rem 1.25rem 1.25rem !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 0.4rem !important;
        margin: 0 !important;
      }

      /* All buttons — base reset */
      html body #CybotCookiebotDialogBodyButtonsWrapper button,
      html body #CybotCookiebotDialogBodyButtonsWrapper a[id*="Button"] {
        font-family: "General Sans", ui-sans-serif, system-ui, sans-serif !important;
        font-size: 0.8125rem !important;
        font-weight: 600 !important;
        border-radius: 9999px !important;
        padding: 0.5rem 1rem !important;
        width: 100% !important;
        margin: 0 !important;
        text-align: center !important;
        cursor: pointer !important;
        transition: background 0.15s, color 0.15s, border-color 0.15s !important;
        line-height: 1.2 !important;
        letter-spacing: 0 !important;
      }

      /* Accept all — filled blush */
      #CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll {
        background: #d35d42 !important;
        color: #fff !important;
        border: 2px solid #d35d42 !important;
        order: 1 !important;
      }
      #CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll:hover {
        background: #bf4a30 !important;
        border-color: #bf4a30 !important;
      }

      /* Allow selection — outline */
      #CybotCookiebotDialogBodyLevelButtonLevelOptinAllowselection {
        background: transparent !important;
        color: #1a1410 !important;
        border: 2px solid #e3d9bf !important;
        order: 2 !important;
      }
      #CybotCookiebotDialogBodyLevelButtonLevelOptinAllowselection:hover {
        border-color: #bfae7b !important;
        background: #efe9d9 !important;
      }

      /* Decline / necessary only — ghost text */
      #CybotCookiebotDialogBodyLevelButtonLevelOptinDeclineAll,
      #CybotCookiebotDialogBodyButtonDecline {
        background: transparent !important;
        color: #8a6841 !important;
        border: 2px solid transparent !important;
        order: 3 !important;
        font-weight: 500 !important;
      }
      #CybotCookiebotDialogBodyLevelButtonLevelOptinDeclineAll:hover,
      #CybotCookiebotDialogBodyButtonDecline:hover {
        color: #1a1410 !important;
        background: #efe9d9 !important;
      }

      /* Powered-by footer */
      #CybotCookiebotDialogPoweredByText,
      #CybotCookiebotDialogPoweredbyLink,
      .CybotCookiebotDialogPoweredByText {
        font-size: 0.6875rem !important;
        color: #bfae7b !important;
        opacity: 0.7 !important;
        display: block !important;
        text-align: center !important;
        padding-bottom: 1rem !important;
      }

      /* Mobile: full-width at bottom (matching specificity so it still wins) */
      @media (max-width: 480px) {
        html body #CybotCookiebotDialog {
          inset: auto 0 0 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          max-height: 85dvh !important;
          border-bottom-left-radius: 0 !important;
          border-bottom-right-radius: 0 !important;
          border-bottom: none !important;
        }
      }
    </style>
    <!--
      Fonts are intentionally NOT loaded from third-party hosts (rsms.me,
      Google Fonts) so that the landing page can render without leaking
      visitor IPs to font CDNs. The Tailwind sans + serif stacks fall
      back to the host OS fonts (Inter / Cormorant if installed locally,
      otherwise the platform UI sans / Georgia for the display serif).
      If we ever want pixel-identical typography across platforms, ship
      WOFF2 files from /public/fonts and re-introduce @font-face rules
      in src/index.css -- but keep them self-hosted.
    -->
    <!-- Microsoft Clarity — loaded unconditionally (NOT consent-gated), per
         product decision, so it starts recording without waiting for the
         Cookiebot statistics opt-in. `data-cookieconsent="ignore"` exempts it
         from Cookiebot's auto-blocking (data-blockingmode="auto"), which would
         otherwise hold clarity.ms back until consent. clarity.ms is
         allow-listed in the CSP (script-src / connect-src / img-src) in
         backend/src/server.ts. -->
    <script type="text/javascript" data-cookieconsent="ignore">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xd80y5mfbo");
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
